name: Automation Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  automation-loop:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTOMATION_DB_SSL: ${{ secrets.AUTOMATION_DB_SSL }}
      AUTOMATION_GSC_ENABLED: ${{ secrets.AUTOMATION_GSC_ENABLED }}
      AUTOMATION_GSC_PROPERTY: ${{ secrets.AUTOMATION_GSC_PROPERTY }}
      AUTOMATION_GSC_AUTH_MODE: ${{ secrets.AUTOMATION_GSC_AUTH_MODE }}
      AUTOMATION_GSC_SUBMIT_SITEMAPS: ${{ secrets.AUTOMATION_GSC_SUBMIT_SITEMAPS }}
      AUTOMATION_SITE_URL: ${{ secrets.AUTOMATION_SITE_URL }}
      AUTOMATION_REVALIDATE_SECRET: ${{ secrets.AUTOMATION_REVALIDATE_SECRET }}
      AUTOMATION_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTOMATION_TELEGRAM_BOT_TOKEN }}
      AUTOMATION_TELEGRAM_CHAT_ID: ${{ secrets.AUTOMATION_TELEGRAM_CHAT_ID }}
      AUTOMATION_X_ENABLED: ${{ secrets.AUTOMATION_X_ENABLED }}
      AUTOMATION_X_ACCESS_TOKEN: ${{ secrets.AUTOMATION_X_ACCESS_TOKEN }}
      AUTOMATION_X_API_BASE_URL: ${{ secrets.AUTOMATION_X_API_BASE_URL }}
      AUTOMATION_GSC_START_DAYS_AGO: ${{ secrets.AUTOMATION_GSC_START_DAYS_AGO }}
      AUTOMATION_GSC_ROW_LIMIT: ${{ secrets.AUTOMATION_GSC_ROW_LIMIT }}
      AUTOMATION_GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.AUTOMATION_GSC_SERVICE_ACCOUNT_JSON }}
      AUTOMATION_GSC_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.AUTOMATION_GSC_SERVICE_ACCOUNT_JSON_BASE64 }}
      AUTOMATION_GSC_CLIENT_EMAIL: ${{ secrets.AUTOMATION_GSC_CLIENT_EMAIL }}
      AUTOMATION_GSC_PRIVATE_KEY: ${{ secrets.AUTOMATION_GSC_PRIVATE_KEY }}
      AUTOMATION_GSC_CLIENT_ID: ${{ secrets.AUTOMATION_GSC_CLIENT_ID }}
      AUTOMATION_GSC_CLIENT_SECRET: ${{ secrets.AUTOMATION_GSC_CLIENT_SECRET }}
      AUTOMATION_GSC_REFRESH_TOKEN: ${{ secrets.AUTOMATION_GSC_REFRESH_TOKEN }}
      AUTOMATION_PARTNER_BINANCE_ENABLED: ${{ secrets.AUTOMATION_PARTNER_BINANCE_ENABLED }}
      AUTOMATION_PARTNER_BINANCE_URL: ${{ secrets.AUTOMATION_PARTNER_BINANCE_URL }}
      AUTOMATION_PARTNER_BINANCE_FORMAT: ${{ secrets.AUTOMATION_PARTNER_BINANCE_FORMAT }}
      AUTOMATION_PARTNER_BINANCE_MODE: ${{ secrets.AUTOMATION_PARTNER_BINANCE_MODE }}
      AUTOMATION_PARTNER_BINANCE_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_BINANCE_AUTH_TYPE }}
      AUTOMATION_PARTNER_BINANCE_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_BINANCE_AUTH_HEADER }}
      AUTOMATION_PARTNER_BINANCE_TOKEN: ${{ secrets.AUTOMATION_PARTNER_BINANCE_TOKEN }}
      AUTOMATION_PARTNER_OKX_ENABLED: ${{ secrets.AUTOMATION_PARTNER_OKX_ENABLED }}
      AUTOMATION_PARTNER_OKX_URL: ${{ secrets.AUTOMATION_PARTNER_OKX_URL }}
      AUTOMATION_PARTNER_OKX_FORMAT: ${{ secrets.AUTOMATION_PARTNER_OKX_FORMAT }}
      AUTOMATION_PARTNER_OKX_MODE: ${{ secrets.AUTOMATION_PARTNER_OKX_MODE }}
      AUTOMATION_PARTNER_OKX_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_OKX_AUTH_TYPE }}
      AUTOMATION_PARTNER_OKX_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_OKX_AUTH_HEADER }}
      AUTOMATION_PARTNER_OKX_TOKEN: ${{ secrets.AUTOMATION_PARTNER_OKX_TOKEN }}
      AUTOMATION_PARTNER_BYBIT_ENABLED: ${{ secrets.AUTOMATION_PARTNER_BYBIT_ENABLED }}
      AUTOMATION_PARTNER_BYBIT_URL: ${{ secrets.AUTOMATION_PARTNER_BYBIT_URL }}
      AUTOMATION_PARTNER_BYBIT_FORMAT: ${{ secrets.AUTOMATION_PARTNER_BYBIT_FORMAT }}
      AUTOMATION_PARTNER_BYBIT_MODE: ${{ secrets.AUTOMATION_PARTNER_BYBIT_MODE }}
      AUTOMATION_PARTNER_BYBIT_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_BYBIT_AUTH_TYPE }}
      AUTOMATION_PARTNER_BYBIT_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_BYBIT_AUTH_HEADER }}
      AUTOMATION_PARTNER_BYBIT_TOKEN: ${{ secrets.AUTOMATION_PARTNER_BYBIT_TOKEN }}
      AUTOMATION_PARTNER_BITGET_ENABLED: ${{ secrets.AUTOMATION_PARTNER_BITGET_ENABLED }}
      AUTOMATION_PARTNER_BITGET_URL: ${{ secrets.AUTOMATION_PARTNER_BITGET_URL }}
      AUTOMATION_PARTNER_BITGET_FORMAT: ${{ secrets.AUTOMATION_PARTNER_BITGET_FORMAT }}
      AUTOMATION_PARTNER_BITGET_MODE: ${{ secrets.AUTOMATION_PARTNER_BITGET_MODE }}
      AUTOMATION_PARTNER_BITGET_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_BITGET_AUTH_TYPE }}
      AUTOMATION_PARTNER_BITGET_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_BITGET_AUTH_HEADER }}
      AUTOMATION_PARTNER_BITGET_TOKEN: ${{ secrets.AUTOMATION_PARTNER_BITGET_TOKEN }}
      AUTOMATION_PARTNER_GATE_ENABLED: ${{ secrets.AUTOMATION_PARTNER_GATE_ENABLED }}
      AUTOMATION_PARTNER_GATE_URL: ${{ secrets.AUTOMATION_PARTNER_GATE_URL }}
      AUTOMATION_PARTNER_GATE_FORMAT: ${{ secrets.AUTOMATION_PARTNER_GATE_FORMAT }}
      AUTOMATION_PARTNER_GATE_MODE: ${{ secrets.AUTOMATION_PARTNER_GATE_MODE }}
      AUTOMATION_PARTNER_GATE_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_GATE_AUTH_TYPE }}
      AUTOMATION_PARTNER_GATE_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_GATE_AUTH_HEADER }}
      AUTOMATION_PARTNER_GATE_TOKEN: ${{ secrets.AUTOMATION_PARTNER_GATE_TOKEN }}
      AUTOMATION_PARTNER_KUCOIN_ENABLED: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_ENABLED }}
      AUTOMATION_PARTNER_KUCOIN_URL: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_URL }}
      AUTOMATION_PARTNER_KUCOIN_FORMAT: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_FORMAT }}
      AUTOMATION_PARTNER_KUCOIN_MODE: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_MODE }}
      AUTOMATION_PARTNER_KUCOIN_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_AUTH_TYPE }}
      AUTOMATION_PARTNER_KUCOIN_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_AUTH_HEADER }}
      AUTOMATION_PARTNER_KUCOIN_TOKEN: ${{ secrets.AUTOMATION_PARTNER_KUCOIN_TOKEN }}
      AUTOMATION_PARTNER_HUOBI_ENABLED: ${{ secrets.AUTOMATION_PARTNER_HUOBI_ENABLED }}
      AUTOMATION_PARTNER_HUOBI_URL: ${{ secrets.AUTOMATION_PARTNER_HUOBI_URL }}
      AUTOMATION_PARTNER_HUOBI_FORMAT: ${{ secrets.AUTOMATION_PARTNER_HUOBI_FORMAT }}
      AUTOMATION_PARTNER_HUOBI_MODE: ${{ secrets.AUTOMATION_PARTNER_HUOBI_MODE }}
      AUTOMATION_PARTNER_HUOBI_AUTH_TYPE: ${{ secrets.AUTOMATION_PARTNER_HUOBI_AUTH_TYPE }}
      AUTOMATION_PARTNER_HUOBI_AUTH_HEADER: ${{ secrets.AUTOMATION_PARTNER_HUOBI_AUTH_HEADER }}
      AUTOMATION_PARTNER_HUOBI_TOKEN: ${{ secrets.AUTOMATION_PARTNER_HUOBI_TOKEN }}

    defaults:
      run:
        working-directory: web

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automation pipeline
        run: npm run automation:daily

      - name: Run quality gates
        run: npm run check

      - name: Commit automation snapshot
        working-directory: .
        run: |
          GENERATED_FILES=(
            web/src/data/generated/automation-state.json
            web/src/data/generated/gsc-query-signals.json
            web/src/data/generated/partner-conversions.json
            web/src/data/generated/partner-commissions.json
            web/src/data/generated/external-sync-state.json
          )

          if git diff --quiet -- "${GENERATED_FILES[@]}"; then
            echo "No automation snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GENERATED_FILES[@]}"
          git commit -m "chore(automation): refresh SEO/GEO automation state"
          git push
