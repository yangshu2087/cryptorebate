name: CTA Live Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

jobs:
  cta-live-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live CTA audit against production
        run: npm run audit:cta
